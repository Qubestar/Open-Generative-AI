[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vidmyo-repurpose"
version = "0.1.0"
description = "Versioned contracts and worker CLI for Vidmyo Repurpose"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "faster-whisper>=1.2,<1.3",
  "jsonschema>=4.23,<5",
  "numpy>=1.26,<3",
  "opencv-python-headless>=4.10,<5",
  "Pillow>=11,<13",
]

[project.optional-dependencies]
alignment = [
  "torch>=2.6,<3",
  "transformers>=4.44,<6",
]
test = [
  "pytest>=8,<9",
]

[project.scripts]
vidmyo-repurpose = "vidmyo_repurpose.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vidmyo_repurpose = ["fonts/*.ttf", "fonts/*-OFL.txt"]

[tool.setuptools.data-files]
"share/vidmyo-repurpose/schemas" = ["schemas/*.json"]
"share/vidmyo-repurpose/models" = ["models/*.onnx", "models/*_LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
